aid: presto-foundation
name: Presto Foundation
description: >-
  The Presto Foundation is a Linux Foundation project supporting Presto, an
  open source distributed SQL query engine for big data analytics. Founded by
  Facebook (Meta), Uber, Twitter, and Alibaba, Presto enables interactive
  analytics across diverse data sources at massive scale, with a vendor-neutral
  governance model and an active ecosystem of contributors and integrations.
