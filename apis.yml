apis:
- aid: presto-foundation:presto-client-rest-api
  name: Presto Client REST API
  description: >-
    The Presto Client REST API is the HTTP protocol used by Presto clients to submit SQL queries to a
    Presto coordinator and stream back results. It centers on POST /v1/statement to submit a query, GET
    on the returned nextUri to fetch subsequent result batches, and DELETE on nextUri to cancel a running
    query. Session context such as user, source, catalog, schema, time zone, and language is conveyed
    through X-Presto-* headers, and supports authentication mechanisms including Kerberos, LDAP, password
    files, OAuth 2.0, and custom authenticators.
  humanURL: https://prestodb.io/docs/current/develop/client-protocol.html
  tags:
  - Analytics
  - Big Data
  - Client Protocol
  - REST API
  - SQL
  properties:
  - type: Documentation
    url: https://prestodb.io/docs/current/develop/client-protocol.html
  - type: REST API Reference
    url: https://prestodb.io/docs/current/rest.html
  - type: GitHubRepository
    url: https://github.com/prestodb/presto
- aid: presto-foundation:presto-coordinator-rest-api
  name: Presto Coordinator REST API
  description: >-
    The Presto Coordinator REST API exposes resources for inspecting and managing a running Presto cluster,
    including Node, Query, Stage, Statement, and Task resources. These endpoints are served by the coordinator
    process and are used by clients, monitoring tools, and the Presto worker protocol to coordinate distributed
    query execution and observe cluster health.
  humanURL: https://prestodb.io/docs/current/rest.html
  tags:
  - Analytics
  - Big Data
  - Cluster Management
  - REST API
  - SQL
